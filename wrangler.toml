name = "co-cane-cabana-spending-tracker"
main = "worker/src/index.ts"
compatibility_date = "2025-07-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "spending-tracker-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "drizzle"

[vars]
APP_ENV = "local"
APP_VERSION = "0.0.0"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
invocation_logs = false

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[env.staging]
name = "co-cane-cabana-spending-tracker-staging"

[env.staging.vars]
APP_ENV = "staging"
APP_VERSION = "0.0.0"

[env.staging.observability]
enabled = true
head_sampling_rate = 1

[env.staging.observability.logs]
invocation_logs = false

[[env.staging.d1_databases]]
binding = "DB"
database_name = "spending-tracker-staging"
database_id = "48f59865-2052-4d6b-b236-a5a6d13465a4"
migrations_dir = "drizzle"

[env.production]
name = "co-cane-cabana-spending-tracker-production"

[env.production.vars]
APP_ENV = "production"
APP_VERSION = "0.0.0"

[env.production.observability]
enabled = true
head_sampling_rate = 1

[env.production.observability.logs]
invocation_logs = false

[[env.production.d1_databases]]
binding = "DB"
database_name = "spending-tracker-db"
database_id = "REPLACE_WITH_PRODUCTION_D1_DATABASE_ID"
migrations_dir = "drizzle"
